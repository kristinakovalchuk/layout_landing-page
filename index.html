<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MyBike</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
<!-- #endregion -->
  <body>

    <header class="header">

      <div class="header__top">
        <a href="#" >
          <img src="src/Logo.png" alt="MyBike logo">
        </a>

        <div class="header__icon">
          <a href="#" class="icon icon--phone">
            <img src="src/Icon/Icon-Phone-call.png" alt="icon-phone">
          </a>

          <a href="#" class="icon icon--menu">
            <img src="src/Icon/Icon-Burger-menu.png" alt="icon--menu">
          </a>
        </div>
      </div>

      <div class="header__bottom">
        <h1>Take the Streets</h1>
      </div>

    </header>

    <aside class="menu" >
      <div class="menu__top">
        <a href="#" >
          <img src="src/Logo.png" alt="MyBike logo">
        </a>

        <div class="menu__icon">
          <a href="#" class="icon icon--phone">
            <img src="src/Icon/icon-Close.png" alt="icon-close">
          </a>
        </div>
      </div>
    </aside>

    <main class="main">

      <section class="About-Us">
        <h1>Move Free</h1>
      </section>

      <section class="Compare-Bikes">
        <h1>Compare Bikes</h1>
      </section>

      <section class="Details">
        <h1>The Details</h1>
      </section>

      <section class="Contacts">
        <h1>Contact us</h1>
      </section>

    </main>

    <footer class="footer">

    </footer>
  </body>
</html>
